site_name: safe-tre-agent
site_description: A safe-outputs gateway for an AI analyst inside a Trusted Research Environment
site_url: https://wadelab.github.io/safe-tre-agent/
repo_url: https://github.com/wadelab/safe-tre-agent
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Source material for the standalone artifact builders
# (scripts/make_framework_page.py and its bestiary counterpart), not pages of
# this site. Their image links are bare filenames resolved against
# docs/figures/, which is right for the builders and unresolvable here — so
# mkdocs was publishing them as orphan pages and failing --strict on four
# broken links. Excluded rather than repointed: fixing the links would break
# the builders, which are the only intended consumers.
exclude_docs: |
  bestiary_artifact/
  framework_artifact/
  chimp_artifact/
  figures/framework/prompts/

nav:
  - Home: index.md
  - Research argument:
      - Explained simply: elif.md
      - The inside analyst, explained simply: inside-analyst-elif.md
      - Research write-up: writeup.md
      - Security model: security.md
      - Architecture: architecture.md
      - Specification: specification.md
      - Policy parameters: policy-parameters.md
      - Assurance case: assurance-case.md
      - Safepod model: safepod.md
      - Model runtime: model-runtime.md
      - Tool manifest: tool-manifest.md
      - Planner evaluation: planner-eval.md
      - The inside analyst (plan): inside-analyst.md
      - Roadmap: roadmap.md
  - Public demo:
      - Overview: public-demo.md
      - Demo in 5 minutes: demo-5-minutes.md
      - Screenshot tour: screenshot-tour.md
      - Evidence checklist: evidence-checklist.md
  - Using the prototype:
      - Beginner guide: beginner.md
      - How to install: install.md
      - User guide: userguide.md
      - Test deployment: test-deployment.md
      - Deployment: deployment.md
      - Serving a different study: datasets.md
      - The NIGHTPLAY study: nightplay-study.md
      - Shadow data: shadow-data.md
      - Certification & hardware: certification.md
      - Development: development.md
      - Maintenance guidelines: maintenance.md
  - Engineering record:
      - Hardening log: hardening-log.md
      - Complexity & opacity review: complexity-review.md
      - Decision log: decision-log.md
      - Decision records:
          - D1 Cells-first models: decisions/D1-cells-first-models.md
          - D2 ACRO composition: decisions/D2-acro-composition.md
          - D3 Second-moment parameters: decisions/D3-second-moment-parameters.md
          - D4 Robust dispersion: decisions/D4-robust-dispersion.md
          - D5 Timing channel: decisions/D5-timing-channel.md
          - D6 Checker default: decisions/D6-checker-default.md
          - D7 Donor totals and band filters: decisions/D7-donor-totals-and-band-filters.md
          - D8 Inside analyst, vetted loop: decisions/D8-inside-analyst-vetted-loop.md
      - Bestiary of caged beasts: bestiary.md
      - Best-practice review: best-practice-review.md
      - ACRO comparison: acro-comparison.md
      - ACRO integration design: acro-integration.md
      - GOV.UK restyle record (delivered): govuk-ui-plan.md
      - Formal methods: formal-methods-analysis.md
