site_name: safe-tre-agent
site_description: A safe-outputs gateway for an AI analyst inside a Trusted Research Environment
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Research argument:
      - Research write-up: writeup.md
      - Security model: security.md
      - Architecture: architecture.md
      - Safepod model: safepod.md
      - Model runtime: model-runtime.md
      - Tool manifest: tool-manifest.md
      - Roadmap: roadmap.md
  - Using the prototype:
      - Beginner guide: beginner.md
      - How to install: install.md
      - User guide: userguide.md
      - Test deployment: test-deployment.md
      - Deployment: deployment.md
      - Certification & hardware: certification.md
      - Development: development.md
  - Engineering record:
      - Hardening log: hardening-log.md
      - Best-practice review: best-practice-review.md
      - Round 2 plan: round2-plan.md
      - Formal methods: FORMAL_METHODS_ANALYSIS.md
      - Verifiable extensions: verifiable-extensions.md
  - Fellowship positioning: fellowship.md
