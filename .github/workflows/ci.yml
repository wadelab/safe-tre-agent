name: ci

# `pull_request` (not pull_request_target): fork PRs run with NO secrets and a
# read-only token, so a malicious PR cannot exfiltrate anything.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # least privilege

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions pinned by commit SHA (not movable tags)
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Sync (frozen — exactly uv.lock)
        run: uv sync --all-extras --frozen
      - name: Lint (ruff)
        run: uv run ruff check safetre safetre_web tests scripts evals redteam formal
      - name: Tests
        run: uv run pytest -q
      - name: Red-team (gateway off vs on)
        run: uv run python redteam/run_redteam.py
      # The round reproducers, which the corpus cannot express: they need a
      # process restart, a mutilated log, or a raising planner. Each exits
      # nonzero while any finding is open, and round 9's also self-checks that
      # it can still fail (hardening #48).
      - name: Round-8 reproducers (differencing, granularity, audit gaps)
        run: uv run python redteam/round8_repro.py
      - name: Round-9 reproducers (restart accounting, log integrity, error cost)
        run: uv run python redteam/round9_repro.py
      - name: Docs build (strict)
        run: uv run --group docs mkdocs build --strict
      - name: SAST (bandit)
        run: uv run bandit -q -r safetre safetre_web
      - name: Dependency audit (CVEs)
        run: uv run pip-audit            # relax to advisory (continue-on-error) if it blocks on an unfixable transitive CVE

  exhaustive:
    # The whole-space passes the default run samples: every point of the query
    # skeleton through the release-equality properties, and every point of the
    # model skeleton through the P21 reproducibility meta-test. They are marked
    # `slow` and excluded from `pytest -q` (pyproject addopts) because they run
    # in minutes rather than seconds — but "exhaustive, not sampled" is the
    # claim the formal argument rests on, so it is checked here rather than on
    # a developer's word.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Sync (frozen — exactly uv.lock)
        run: uv sync --all-extras --frozen
      - name: Exhaustive skeleton passes
        run: uv run pytest -m slow -q

  acro-compare:
    # Roadmap item 1, slice 1: ACRO's cell decisions vs the stand-in's over
    # the red-team corpus. Gates on HARNESS integrity (translation and
    # execution), not on agreement — divergence is the measurement, printed
    # in the job log. Separate environment because ACRO 0.4.x pins
    # pandas < 3 ([tool.uv] conflicts in pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Compare ACRO decisions with the stand-in gateway
        run: uv run --frozen --no-default-groups --group acro python redteam/run_acro_compare.py

  formal:
    # The machine-checked layer (R16): Alloy bounded model checks (the GLM
    # release path, the disclosure-policy lineage rule, and the temporal
    # session model of the auditor) plus the Lean 4
    # proofs over the generated catalogue (identifier non-membership, label
    # consistency, SafeSQL compilation, the engine pin). The pytest job
    # already pins code -> generated artifacts correspondence; this job only
    # has to replay solvers and proofs. Both toolchains come from GitHub
    # releases pinned by sha256 (same supply-chain posture as the SHA-pinned
    # actions); run_checks.py turns Alloy receipts into the verdict because
    # the Alloy CLI exits 0 even on a counterexample.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Temurin 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch Alloy 6.2.0 (sha256-pinned)
        run: |
          curl -sL -o /tmp/alloy.jar https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
          echo "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d  /tmp/alloy.jar" | sha256sum -c
      - name: Model check (P19/P21/P4, disclosure lineage, temporal session + vacuity guards)
        run: python3 formal/run_checks.py --jar /tmp/alloy.jar
      - name: Fetch Lean 4.32.0 (sha256-pinned)
        run: |
          curl -sL -o /tmp/lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          echo "fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  /tmp/lean.tar.zst" | sha256sum -c
          mkdir /tmp/lean && tar --use-compress-program=unzstd -xf /tmp/lean.tar.zst -C /tmp/lean --strip-components=1
      - name: Replay the Lean proofs (identifier/label/SafeSQL theorems)
        working-directory: formal/lean
        run: PATH=/tmp/lean/bin:$PATH lake build

  accessibility:
    # pa11y (WCAG 2AA) against the four demo states, using the runner's Chrome.
    # SAFETRE_LLM=mock: CI has no local model, and the mock planner is the
    # explicit tests/CI opt-in (never a silent fallback).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Sync (frozen — exactly uv.lock)
        run: uv sync --all-extras --frozen
      - name: Start the demo server (mock planner, synthetic data)
        run: |
          SAFETRE_LLM=mock nohup uv run uvicorn safetre_web.app:app \
            --host 127.0.0.1 --port 8800 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8800/healthz > /dev/null && exit 0
            sleep 0.5
          done
          echo "server did not become healthy; log follows" >&2
          cat /tmp/web.log >&2
          exit 1
      - name: pa11y (WCAG 2AA) on home, released, redacted, denied
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          printf '%s' '{"chromeLaunchConfig": {"executablePath": "/usr/bin/google-chrome", "args": ["--no-sandbox"]}}' > /tmp/pa11y.json
          npx -y pa11y --config /tmp/pa11y.json --wait 3000 "http://127.0.0.1:8800/"
          npx -y pa11y --config /tmp/pa11y.json --wait 4000 "http://127.0.0.1:8800/#q=mean%20spend%20by%20age%20band"
          npx -y pa11y --config /tmp/pa11y.json --wait 4000 "http://127.0.0.1:8800/#q=mean%20spend%20by%20age%20band,%20region%20and%20device%20os"
          npx -y pa11y --config /tmp/pa11y.json --wait 4000 "http://127.0.0.1:8800/#q=report%20wellbeing%20per%20donor"
