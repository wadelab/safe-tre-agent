[project]
name = "safe-tre-agent"
version = "0.4.0"
description = "Safe-outputs gateway for an AI analyst inside a Trusted Research Environment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Wade", email = "wade@wadelab.net" }]
requires-python = ">=3.11"
keywords = [
    "trusted-research-environment", "statistical-disclosure-control",
    "safe-outputs", "llm-safety", "sdc", "tre", "glm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.6",   # validated QuerySpec — the security boundary, not optional
    "duckdb>=1.0",     # read-only query engine
]

[project.urls]
Repository = "https://github.com/wadelab/safe-tre-agent"
Documentation = "https://github.com/wadelab/safe-tre-agent/tree/main/docs"
Changelog = "https://github.com/wadelab/safe-tre-agent/blob/main/CHANGELOG.md"

[project.scripts]
safetre-demo = "safetre.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
]
llm = [
    # no extra dependency: safetre.llm uses the stdlib HTTP client against an
    # OpenAI-compatible local endpoint (vLLM / llama.cpp / Ollama proxy / etc.)
]

[dependency-groups]
acro = [
    # the decision-comparison harness only (redteam/run_acro_compare.py);
    # ACRO stays OUT of the runtime install surface until roadmap item 1's
    # integration slice
    "acro>=0.4.12",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "matplotlib>=3.7",  # write-up figure
    "scipy>=1.11",      # cross-validates the stdlib-only safetre.stats numerics
    "bandit>=1.7",      # security linter (SAST)
    "pip-audit>=2.7",   # dependency vulnerability audit
    "statsmodels>=0.14",  # oracle for the stdlib-only IRLS in safetre.stats (dev-only: the runtime install surface is unchanged)
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",   # optional: `uv run --group docs mkdocs serve`
]
decks = [
    "python-pptx>=0.6.23",    # optional: `uv run --group decks python scripts/make_decks.py`
]

# The research core (safetre) is an installable library so TRE/SDC teams can
# wrap the gateway without adopting the demo web shell. safetre_web ships too,
# but is a reference deployment, not part of the security claim (see README).
[tool.uv]
# ACRO 0.4.x pins pandas < 3; the project runtime is on pandas 3. The groups
# resolve separately so the comparison harness gets its own environment:
#   uv run --no-default-groups --group acro python redteam/run_acro_compare.py
conflicts = [[{ group = "acro" }, { group = "dev" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safetre", "safetre_web"]

[tool.hatch.build.targets.sdist]
# source distribution = the reviewable research artifact: code, tests, docs,
# formal model, harnesses. Hidden local-tooling directories (editor/agent
# config — anything dot-prefixed except .github) and binary decks stay out.
exclude = [".[!g]*/", "artifacts/*.ppt", "artifacts/*.pptx", "site"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `slow` marks the exhaustive full-skeleton passes (run with: pytest -m slow)
markers = ["slow: exhaustive whole-skeleton runs, excluded from the default run"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# defaults (E4/E7/E9 + F) — pyflakes correctness plus gross style; the goal is
# a zero-findings baseline, not a style rewrite
select = ["E4", "E7", "E9", "F"]
