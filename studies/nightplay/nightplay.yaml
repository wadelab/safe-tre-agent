planner_hints:
  - "Five datasets: 'sessions' is one row per phone session, 'bets' one row per gambling transaction, 'panel' one row per person per calendar month (the analysis panel: that month's phone sessions, late-night sessions and minutes, gambling transactions, stake, net loss and giving), 'wellbeing' one row per person per questionnaire wave, 'giving' one row per donation."
  - "'Late-night phone use' as a property of PEOPLE is the dimension night_use_band (rare/occasional/regular/heavy), available in every dataset; as a property of EVENTS it is the filter hour_band == late_night in sessions or bets. A per-month quantity of late-night use is the panel measure late_night_sessions (or late_night_minutes)."
  - "For 'does late-night use predict/affect stake' use dataset 'panel': mean stake_gbp by night_use_band, or corr with x='late_night_sessions', y='stake_gbp', or a gaussian glm with response stake_gbp and term night_use_band. To adjust for a confounder, add it as a further glm term (e.g. employment)."
  - "Raw age is an internal analysis variable only: filter it at band edges, never group by it or return it. For age-versus-stake correlation use dataset 'panel', x='age_years', y='stake_gbp'."

planner_examples:
  - request: mean monthly stake by night use band
    spec:
      dataset: panel
      measure: {fn: mean, column: stake_gbp}
      group_by: [night_use_band]
      filters: []
  - request: correlation between late-night sessions and stake
    spec:
      dataset: panel
      measure: {fn: corr, column: null, x: late_night_sessions, y: stake_gbp}
      group_by: []
      filters: []
  - request: regress stake on night use band adjusting for employment
    spec:
      tool: glm
      dataset: panel
      family: gaussian
      response: stake_gbp
      terms: [night_use_band, employment]
      filters: []
  - request: mean stake per bet by hour band for casino bets
    spec:
      dataset: bets
      measure: {fn: mean, column: stake_gbp}
      group_by: [hour_band]
      filters:
        - {column: product, op: "==", value: casino}
  - request: one-way anova of pgsi by night use band at wave 3
    spec:
      tool: anova
      dataset: wellbeing
      response: pgsi_score
      factor: night_use_band
      filters:
        - {column: wave, op: "==", value: 3}

ui_queries:
  - {label: "Mean monthly stake by night use band", query: "mean monthly stake by night use band"}
  - {label: "Correlation between late-night sessions and stake",
     query: "correlation between late-night sessions and stake"}
  - {label: "Regress stake on night use band adjusting for employment",
     query: "regress stake on night use band adjusting for employment"}
  - {label: "Mean stake per bet by month", query: "mean stake by month"}
  - {label: "Mean monthly donation by night use band (the planted null)",
     query: "mean donations by night use band"}
  - {label: "Total stake by region and product (triggers suppression and dominance)",
     query: "total stake by region and product"}

tour:
  - mean monthly stake by night use band
  - correlation between late-night sessions and stake
  - regress stake on night use band adjusting for employment
  - mean donations by night use band
  - total stake by region and product            # suppression + dominance
