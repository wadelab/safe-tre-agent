# Extra operator-authored guidance lines for the planner system prompt.
planner_hints:
  - "For age-versus-spend correlation, use dataset 'donor_spend', x='age_years', y='total_spend_gbp'. Raw age is an internal analysis variable only: never group by it or return it."

# Few-shot examples rendered into the planner system prompt.
planner_examples:
  - request: regress total spend on age band and sex
    spec:
      tool: glm
      dataset: donor_spend
      family: gaussian
      response: total_spend_gbp
      terms: [age_band, sex]
      filters: []
  - request: logistic model of lootbox availability by genre for purchases
    spec:
      tool: glm
      dataset: spend
      family: binomial
      response: contains_lootboxes
      terms: [genre]
      filters:
        - {column: event_type, op: "==", value: purchase}
  - request: one-way anova of wellbeing by region
    spec:
      tool: anova
      dataset: wellbeing
      response: wemwbs_score
      factor: region
      filters: []

# Example queries on the web index page.
ui_queries:
  - {label: "Mean spend by age band", query: "mean spend by age band"}
  - {label: "Mean wellbeing by region", query: "mean wellbeing by region"}
  - {label: "Correlation between age and spend", query: "correlation between age and spend"}
  - {label: "Mean spend by region and device (triggers suppression)",
     query: "mean spend by region and device os"}
  - {label: "Wellbeing per donor (rejected by validation)",
     query: "show mean wellbeing per donor"}

# The `safetre-demo` scripted tour.
tour:
  - mean spend by age band
  - regress total spend on age band
  - logistic glm of lootbox availability by price tier
  - regress total spend on age band and sex          # denied: suppressed cell
  - poisson glm of purchase events on device os      # denied: hostile value cell
